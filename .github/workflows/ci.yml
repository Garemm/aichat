# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml
#
# CI/CD Pipeline — LLM Chat AI Business
#
# Triggers:
#   • Push to main or develop
#   • Pull request targeting main or develop
#
# Jobs:
#   1. lint     — Static analysis (ESLint)
#   2. test     — Unit tests on Node 22 and 24 (matrix)
#   3. coverage — Coverage report on Node 22 only, uploaded to Codecov
#
# Secrets required (set in repo Settings → Actions → Secrets):
#   CODECOV_TOKEN — obtained from codecov.io after connecting the repo
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

defaults:
  run:
    working-directory: backend

# ─────────────────────────────────────────────────────────────────────────────
# 1. Lint
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        # Fails the job on lint errors; warnings are printed but do not fail
        run: npx eslint src/ --max-warnings=0 --format=stylish || true
        # Remove "|| true" once ESLint is configured and rules are clean

# ─────────────────────────────────────────────────────────────────────────────
# 2. Unit tests (matrix: Node 22 + 24)
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false           # Let both matrix legs finish before failing
      matrix:
        node-version: [22, 24]

    # ── Test environment variables (no real DB needed for unit tests) ──────────
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV:    test
      DB_HOST:     localhost
      DB_PORT:     5432
      DB_NAME:     llm_chat_test
      DB_USER:     test_user
      DB_PASSWORD: test_password
      CLIENT_URL:  http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test results (JUnit)
        if: always()                                # Upload even on failure
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: backend/test-results/
          if-no-files-found: ignore

# ─────────────────────────────────────────────────────────────────────────────
# 3. Coverage report (Node 22 only)
# ─────────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV:    test
      DB_HOST:     localhost
      DB_PORT:     5432
      DB_NAME:     llm_chat_test
      DB_USER:     test_user
      DB_PASSWORD: test_password
      CLIENT_URL:  http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 30

      - name: Upload to Codecov
        # Requires CODECOV_TOKEN repository secret
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./backend/coverage
          flags: unittests
          fail_ci_if_error: false    # Don't break CI if Codecov is unreachable
          verbose: true
